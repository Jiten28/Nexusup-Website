# Internal TLS edge required: listen only behind a trusted HTTPS terminator.
# This profile assumes ALL external traffic is HTTPS; never expose directly.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    location ~ ^/(api/|admin/|health/|feed/|sitemap\.xml$|robots\.txt$|ads\.txt$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /static/ { alias /srv/static/; }
    location /media/ { alias /srv/media/; autoindex off; }
    location /wp-content/uploads/ { alias /srv/media/; autoindex off; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
