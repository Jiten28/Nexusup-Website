# MariaDB for NexusUp (development and demo). Start it with:  scripts/db.sh up   |   scripts\db.ps1 up
# Data lives in the named Docker volume "nexusup_mariadb", so it survives restarts.
name: nexusup
services:
  db:
    image: mariadb:11.4
    container_name: nexusup-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-nexusup}
      MARIADB_USER: ${DB_USER:-nexusup}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Copy database/.env.example to database/.env and set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Copy database/.env.example to database/.env and set DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"   # reachable from this computer only
    volumes:
      - mariadb:/var/lib/mysql
      - ./scripts/container:/scripts:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mariadb:
    name: nexusup_mariadb
