{% if slides %}<section class="wrap horizontal-headlines" data-component="horizontal-headlines" aria-label="Featured headlines"><div class="section-top"><h2>Headlines, in focus</h2><div><button data-horizontal="prev" aria-label="Previous headlines">←</button><button data-horizontal="pause" aria-pressed="false">Play</button><button data-horizontal="next" aria-label="Next headlines">→</button></div></div><div class="horizontal-headlines-track">{% for post in slides %}<article><a href="{{ post.get_absolute_url }}"><img src="{{ post.image_src }}" alt="{{ post.image_alt }}" loading="lazy"><span class="eyebrow">{{ post.category.name }}</span><h3>{{ post.title }}</h3>{% if post.is_sample %}<small>Sample story</small>{% endif %}</a></article>{% endfor %}</div></section>{% endif %}
