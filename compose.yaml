# Optional production topology. Requires a trusted HTTPS edge in front of 127.0.0.1:8080.
# Copy .env.production.example to .env, fill secrets privately, review docs/DEPLOYMENT.md.
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME}
      MARIADB_USER: ${DB_USER:?Set DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes: [database:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      # Private Compose network only; use TLS for a remote/shared network.
      DB_TLS_REQUIRED: '0'
      MEDIA_ROOT: /app/media
      STATIC_ROOT: /app/staticfiles
      TRUST_PROXY_HTTPS: '1'
    volumes: [media:/app/media, static:/app/staticfiles]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ['127.0.0.1:8080:80']
    volumes: [media:/srv/media:ro, static:/srv/static:ro]
    depends_on: [backend]
    restart: unless-stopped
  scheduler:
    profiles: [ingestion]
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    environment:
      DB_HOST: db
      DB_TLS_REQUIRED: '0'
      NEWS_FETCH_ENABLED: '1'
      MEDIA_ROOT: /app/media
    volumes: [media:/app/media]
    command: [sh, -c, 'while true; do python manage.py fetch_news; sleep 900; done']
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
volumes:
  database:
  media:
  static:
